<!DOCTYPE html>

<html lang="en">

<head>
  <link
  rel="apple-touch-icon"
  href="icon-192.png"
  >

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Album Rater</title>

  <meta
    name="theme-color"
    content="#f5f5f7"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Album Rater"
  >

  <link
    rel="manifest"
    href="manifest.webmanifest"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

  <header>
    <button id="backBtn" class="hidden">← Back</button>
    <h1 id="pageTitle">Artists</h1>
    <button id="addBtn">+</button>
  </header>

  <main>

    <!-- ARTIST PAGE -->
    <section id="artistPage">
      <div id="artistGrid" class="grid"></div>
    </section>

    <!-- ALBUM PAGE -->
    <section id="albumPage" class="hidden">
      <div id="artistProfile"></div>

      <section class="artist-albums-section">
        <h2 class="section-title">Albums</h2>
        <div id="albumGrid" class="grid"></div>
      </section>
    </section>

    <!-- RATING PAGE -->
    <section id="ratingPage" class="hidden">
      <div id="albumHeader"></div>
      <div id="trackList"></div>
    </section>

<div id="backupSection">
  <button id="exportBtn">Export Backup</button>

  <label for="importFile" class="importButton">
    Import Backup
  </label>

  <input
    id="importFile"
    type="file"
    accept=".json"
    hidden
  >
</div>

  </main>

  <!-- ADD ARTIST MODAL -->
  <div id="artistModal" class="modal hidden">
    <div class="modalBox">

      <h2>Add Artist</h2>

      <input
        id="artistNameInput"
        type="text"
        placeholder="Artist name"
      >

      <label>Artist Image</label>
      <input
        id="artistImageInput"
        type="file"
        accept="image/*"
      >

      <label>Artist Description</label>
      <textarea
        id="artistDescriptionInput"
        placeholder="Where they are from, style, background, notes..."
      ></textarea>

      <div class="modalButtons">
        <button id="cancelArtistBtn">Cancel</button>
        <button id="saveArtistBtn">Save</button>
      </div>

    </div>
  </div>

  <!-- ADD ALBUM MODAL -->
  <div id="albumModal" class="modal hidden">
    <div class="modalBox">

      <h2>Add Album</h2>

      <input
        id="albumNameInput"
        type="text"
        placeholder="Album name"
      >

      <label>Album Cover</label>
      <input
        id="albumImageInput"
        type="file"
        accept="image/*"
      >

      <label>Tracklist</label>

<textarea
  id="tracklistInput"
  placeholder="Enter one song per line

Song 01
Song 02
Song 03
Song 04
Song 05
..."
></textarea>
      <div class="modalButtons">
        <button id="cancelAlbumBtn">Cancel</button>
        <button id="saveAlbumBtn">Save</button>
      </div>

    </div>
  </div>

  <script src="js/state.js"></script>
  <script src="js/dom.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/edit.js"></script>
  <script src="js/views.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
